workflows:
  ios-testflight:
    name: Parsec iOS — TestFlight
    max_build_duration: 60
    integrations:
      app_store_connect: App Store Connect
    environment:
      node: v20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web assets
        script: npm run build
      - name: Sync web assets to Capacitor iOS
        script: npx cap sync ios
      - name: Install CocoaPods dependencies
        script: cd ios/App && pod install
      - name: Set up keychain
        script: keychain initialize
      - name: Create distribution certificate
        script: app-store-connect create-certificate --type IOS_DISTRIBUTION --save
      - name: Create provisioning profile
        script: |
          app-store-connect fetch-signing-files "com.parsec.game" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Apply provisioning profiles to Xcode project
        script: xcode-project use-profiles
      - name: Build .ipa
        script: |
          xcode-project build-ipa \
            --workspace ios/App/App.xcworkspace \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
